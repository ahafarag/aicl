[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-lab"
version = "0.1.0"
description = "Reproducible, transparent stylometric measurement for prose and AI-assisted writing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Abdelrahman" }]
keywords = ["stylometry", "nlp", "ai-detection", "perplexity", "burstiness", "writing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing :: Linguistic",
  "Intended Audience :: Science/Research",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ahafarag/ai-content-lab"
Issues = "https://github.com/ahafarag/ai-content-lab/issues"

[project.optional-dependencies]
lm = ["torch>=2.1", "transformers>=4.40"]
dev = ["pytest>=8"]

[project.scripts]
aicl = "aicl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
